<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>SVG Diagram</title>
   </head>
   <style>
      svg {
         width: 80%; /* Takes up 80% of its container's width */
         height: auto; /* Height automatically adjusts to maintain aspect ratio */
         max-width: 500px; /* Optional: Prevents SVG from becoming too large */
      }
   </style>
   <body>
      <?xml version="1.0" encoding="UTF-8"?>
      <svg
         width="200"
         height="200"
         viewBox="0 0 200 200"
         xmlns="http://www.w3.org/2000/svg"
      >
         <!-- Rectangle ABCD -->
         <rect
            x="50"
            y="50"
            width="80"
            height="60"
            fill="none"
            stroke="#000000"
            stroke-width="2"
         />

         <!-- Point E -->
         <circle cx="90" cy="110" r="4" fill="#000000" />

         <!-- Segment AE -->
         <line
            x1="50"
            y1="50"
            x2="90"
            y2="110"
            stroke="#000000"
            stroke-width="2"
         />
      </svg>
      <canvas id="myCanvas" width="1000" height="500"></canvas>
   </body>
   <script></script>
</html>
