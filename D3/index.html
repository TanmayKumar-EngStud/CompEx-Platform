<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <title>4-Set Qualitative Venn Diagram using D3.js</title>
      <script src="https://d3js.org/d3.v6.min.js"></script>
      <style>
         .venn-set {
            fill-opacity: 0.4;
            stroke: black;
            stroke-width: 2px;
         }
         .venn-text {
            font-family: Arial, sans-serif;
            font-size: 12px;
            text-anchor: middle;
         }
         .label {
            font-size: 14px;
            font-weight: bold;
            text-anchor: middle;
         }
      </style>
   </head>
   <body>
      <svg width="600" height="600"></svg>
      <script>
         const svg = d3.select("svg");

         // Venn diagram layout properties (4 sets)
         const width = 600;
         const height = 600;
         const centerX = width / 2;
         const centerY = height / 2;
         const radius = 100;

         // Define sets and their intersections
         const sets = [
            {
               label: "A",
               x: 200,
               y: 250,
               color: "steelblue",
               data: ["α", "β"],
            },
            { label: "B", x: 300, y: 150, color: "orange", data: ["β", "γ"] },
            { label: "C", x: 400, y: 250, color: "green", data: ["γ", "δ"] },
            { label: "D", x: 300, y: 350, color: "purple", data: ["α", "δ"] },
         ];

         // Create circles (sets)
         svg.selectAll("circle")
            .data(sets)
            .enter()
            .append("circle")
            .attr("cx", (d) => d.x)
            .attr("cy", (d) => d.y)
            .attr("r", radius)
            .style("fill", (d) => d.color)
            .style("fill-opacity", 0.3)
            .style("stroke", "black")
            .style("stroke-width", 2);

         // Add labels for each set
         svg.selectAll(".label")
            .data(sets)
            .enter()
            .append("text")
            .attr("class", "label")
            .attr("x", (d) => d.x)
            .attr("y", (d) => d.y)
            .attr("dy", -radius - 10) // Position above the circle
            .text((d) => d.label);

         // Add intersection data as text inside the circles (qualitative data)
         const intersections = [
            { set: "A", label: "α, β", x: 250, y: 230 },
            { set: "B", label: "β, γ", x: 320, y: 170 },
            { set: "C", label: "γ, δ", x: 370, y: 270 },
            { set: "D", label: "α, δ", x: 320, y: 320 },
            { set: "A & B", label: "β", x: 250, y: 170 },
            { set: "B & C", label: "γ", x: 350, y: 220 },
            { set: "C & D", label: "δ", x: 350, y: 320 },
            { set: "A & D", label: "α", x: 230, y: 300 },
            { set: "A & B & C", label: "β, γ", x: 300, y: 200 },
            { set: "B & C & D", label: "γ, δ", x: 340, y: 270 },
            { set: "A & C & D", label: "α, δ", x: 270, y: 280 },
            { set: "A & B & C & D", label: "No overlap", x: 300, y: 250 },
         ];

         svg.selectAll(".venn-text")
            .data(intersections)
            .enter()
            .append("text")
            .attr("class", "venn-text")
            .attr("x", (d) => d.x)
            .attr("y", (d) => d.y)
            .text((d) => `${d.label}`);
      </script>
   </body>
</html>
